<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Ivy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300&display=swap">
<style>
:root{--bg:#07060c;--ink:#f6ead9;--gold:#e9c58d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060c;--ink:#f6ead9;--gold:#e9c58d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#07060c;--ink:#f6ead9;--gold:#e9c58d}
html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(ellipse 90% 70% at 50% 105%,#33182a 0%,#150e1d 45%,var(--bg) 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(0,0,0,.6) 100%)}
.veil{position:fixed;inset:0;background:var(--bg);z-index:5;pointer-events:none;animation:fade 1.2s 0s ease forwards}
.msg{position:fixed;left:0;right:0;top:calc(9% + env(safe-area-inset-top,0px));text-align:center;padding:0 24px;font-family:"Jost",system-ui,sans-serif;font-weight:300;color:var(--ink);pointer-events:none;z-index:2}
.msg>*{margin:0;opacity:0}
.a{text-transform:lowercase;font-size:clamp(14px,3.6vw,19px);letter-spacing:.42em;margin-right:-.42em;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.8);animation:rise 1.2s 1.4s ease forwards}
.n{margin:8px auto 0;opacity:1;width:min(78vw,500px);line-height:0}
.n svg{width:100%;height:auto;display:block;overflow:visible}
.s{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 2px 10px rgba(0,0,0,.6));animation:draw var(--d) var(--t) cubic-bezier(.5,0,.3,1) forwards}
.lf{fill:#b5e0bd;opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:leaf .6s cubic-bezier(.2,.9,.3,1.3) forwards}
.bl{opacity:0;transform-box:fill-box;transform-origin:50% 50%;animation:leaf .8s cubic-bezier(.2,.9,.3,1.3) forwards}
.rule{display:block;height:14px}
.l{color:#fff;font-size:clamp(17px,4.2vw,22px);line-height:1.7;letter-spacing:.03em;text-shadow:0 2px 16px rgba(0,0,0,.9);animation:rise 1.2s 4.9s ease forwards}
.l2{animation-delay:5.6s}
.hint{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font:300 15px "Jost",system-ui,sans-serif;letter-spacing:.08em;color:rgba(255,255,255,.8);opacity:0;z-index:2;pointer-events:none;animation:rise 1s 6s ease forwards}
@keyframes fade{to{opacity:0}}
@keyframes rise{to{opacity:1}}
.go{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;font:300 15px "Jost",system-ui,sans-serif;letter-spacing:.2em;text-transform:lowercase;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.45);border-radius:40px;padding:14px 28px;cursor:pointer;opacity:0;animation:rise 1s 6.4s ease forwards;backdrop-filter:blur(6px);white-space:nowrap}
.pg2{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;font:300 16px "Jost",system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 45%,rgba(7,6,12,.72),rgba(7,6,12,.4));opacity:0;pointer-events:none;transition:opacity .6s ease}
.pg2.on{opacity:1;pointer-events:auto}
.pg2 .t{margin:0;letter-spacing:.4em;margin-right:-.4em;text-transform:lowercase;font-size:15px;opacity:.85}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px;max-width:440px}
.fl{all:unset;box-sizing:border-box;width:104px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;font-size:13px;line-height:1.3;transition:opacity .6s}
.fl:focus-visible{outline:1px solid #fff;outline-offset:4px}
.fl canvas{width:92px;height:92px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.6));transition:transform .6s cubic-bezier(.2,.9,.3,1.2)}
.fl:hover canvas{transform:scale(1.08) rotate(4deg)}
.fl.open canvas{transform:scale(1.15)}
.fl.open span{opacity:.55}
.fl.lock{opacity:.35}
.fl.nudge{animation:nudge .4s}
.card{min-height:6.5em;max-width:460px;text-align:center;font-size:clamp(19px,4.8vw,24px);line-height:1.55}
.card p{margin:0}
.p2 .msg,.p2 .go,.p2 .hint{opacity:0!important;pointer-events:none;transition:opacity .5s}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes leaf{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes name{from{opacity:0;filter:blur(14px) drop-shadow(0 4px 18px rgba(0,0,0,.8));letter-spacing:.14em}to{opacity:1;filter:blur(0) drop-shadow(0 4px 18px rgba(0,0,0,.8));letter-spacing:0}}
@media (prefers-reduced-motion:reduce){.veil,.msg>*,.hint{animation-duration:.01s;animation-delay:0s}}
.upd{width:min(88vw,420px);max-height:86vh;overflow:auto;padding:30px 26px;border:1px solid rgba(255,255,255,.18);border-radius:20px;background:rgba(14,10,22,.55);backdrop-filter:blur(10px);text-align:center}
.upd .lab{margin:0;font-size:13px;letter-spacing:.32em;text-transform:lowercase;opacity:.7}
.upd h2{margin:10px 0 4px;font-weight:300;font-size:clamp(40px,11vw,56px)}
.upd .sub{margin:0 0 22px;opacity:.75}
.inst{font:300 15px "Jost",system-ui,sans-serif;letter-spacing:.2em;text-transform:lowercase;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.5);border-radius:40px;padding:12px 30px;cursor:pointer}
.bar{display:none;height:2px;background:rgba(255,255,255,.15);border-radius:2px;margin:18px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff}
.pct{display:none;margin:0;font-size:13px;opacity:.7}
.notes{text-align:left}
.notes h3{margin:18px 0 6px;font-size:13px;font-weight:400;letter-spacing:.24em;text-transform:lowercase;opacity:0;animation:rise .8s forwards}
.notes p{margin:5px 0;font-size:17px;line-height:1.45;opacity:0;animation:rise .8s forwards}
.notes .fin{margin-top:24px;text-align:center;font-size:28px}
.note{max-width:440px;max-height:88vh;overflow:auto;text-align:center}
.note p{margin:0 0 22px;font-size:clamp(18px,4.6vw,22px);line-height:1.7;letter-spacing:.01em;text-shadow:0 2px 16px rgba(0,0,0,.8);opacity:0;animation:rise .7s forwards}
.note .fin{margin:30px 0 0;font-size:clamp(28px,8vw,38px);line-height:1.2}
.note .ps{margin:18px 0 0;font-size:clamp(15px,3.8vw,18px);opacity:0}
.note .kit{display:block;margin:16px auto 0;max-width:min(60vw,220px);border-radius:14px;opacity:0;animation:rise 1s forwards}
.ld{width:min(72vw,320px);text-align:center;transition:opacity .3s}
.ld .bar,.ld .pct{display:block}
.back{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:14px;font:300 14px "Jost",system-ui,sans-serif;letter-spacing:.14em;text-transform:lowercase;color:rgba(255,255,255,.7);background:none;border:0;padding:10px;cursor:pointer}
.back:hover{color:#fff}
.ld .pct{margin-top:14px;font-size:14px;letter-spacing:.08em}
#pg3{background:radial-gradient(ellipse at 50% 45%,rgba(7,6,12,.95),rgba(7,6,12,.88))}
.vcard{width:min(88vw,420px);padding:10px;border:1px solid rgba(255,255,255,.18);border-radius:22px;background:rgba(14,10,22,.55);backdrop-filter:blur(10px)}
.vcard video{display:block;width:100%;border-radius:14px}
.note .sur{margin-top:22px;font:300 15px "Jost",system-ui,sans-serif;letter-spacing:.16em;text-transform:lowercase;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.5);border-radius:40px;padding:13px 28px;cursor:pointer;opacity:0;animation:rise .7s forwards}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="veil"></div>
<div class="msg">
  <p class="a">Happy Birthday</p>
  <h1 class="n" aria-label="Ivy"><svg id="ivy" viewBox="-10 0 340 210" aria-hidden="true"><path class="s" pathLength="1" style="--t:2s;--d:.25s" d="M 42 40 C 62 33 82 33 100 40"/><path class="s" pathLength="1" style="--t:2.25s;--d:.4s" d="M 72 36 C 68 80 64 124 60 154"/><path class="s" pathLength="1" style="--t:2.65s;--d:.25s" d="M 40 156 C 58 150 80 150 98 157"/><path class="s" pathLength="1" style="--t:2.95s;--d:.5s" d="M 120 84 C 122 116 134 138 152 138 C 170 136 182 106 190 82"/><path class="s" pathLength="1" style="--t:3.5s;--d:.5s" d="M 214 84 C 216 116 230 138 250 134 C 270 128 280 100 282 82"/><path class="s" pathLength="1" style="--t:4.05s;--d:.6s" d="M 282 82 C 288 130 276 176 240 188 C 214 194 206 170 232 166"/><g id="leaves"></g></svg></h1>
  <i class="rule"></i>
  <p class="l">I can’t be there, so I made you this.</p>
  <p class="l l2">Hope your year is full of good laughs.</p>
</div>
<div class="hint">tap anywhere on the garden and the flowers keep growing</div>
<button class="go" id="go">one more thing →</button>
<section class="pg2" id="pg2" aria-hidden="true"><button class="back" id="back" aria-label="Back to the garden">← back</button><div class="ld" id="ld"><div class="bar" id="bar"><i></i></div><p class="pct" id="pct">loading… 0%</p></div><div class="note" id="note"></div></section>
<section class="pg2" id="pg3" aria-hidden="true"><button class="back" id="back3" aria-label="Back to the message">← back</button><div class="vcard"><video id="vid" src="https://static.klipy.com/ii/4493325008d34b7bf8cd6813cd5c1619/00/9b/0boYMtRPdg7HRnB.mp4" muted loop playsinline preload="auto"></video></div></section>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const S=200,C=S/2,R=86,ST=14,TAU=6.283;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const ease=p=>1-Math.pow(1-p,3),col=(h,s,l)=>`hsl(${h},${s}%,${l}%)`;
let W,H,DPR,L=[[],[],[]],blades=[],flies=[],fall=[],last=0,lastDrop=0;
const SC=[.55,.8,1];

/* ---------- petal + flower sprites (pre-rendered bloom stages) ---------- */
function path(c,len,wid,pointy){
  c.beginPath();c.moveTo(0,0);
  if(pointy){c.bezierCurveTo(-wid,-len*.25,-wid*.8,-len*.8,0,-len);c.bezierCurveTo(wid*.8,-len*.8,wid,-len*.25,0,0)}
  else{c.bezierCurveTo(-wid*1.1,-len*.2,-wid*1.05,-len*1.02,0,-len);c.bezierCurveTo(wid*1.05,-len*1.02,wid*1.1,-len*.2,0,0)}
  c.closePath();
}
function petal(c,len,wid,ang,dark,light,pointy){
  c.save();c.rotate(ang);
  const g=c.createLinearGradient(0,0,0,-len);g.addColorStop(0,dark);g.addColorStop(1,light);
  path(c,len,wid,pointy);c.fillStyle=g;c.fill();
  c.strokeStyle='rgba(0,0,0,.2)';c.lineWidth=1;c.stroke();
  c.strokeStyle='rgba(255,255,255,.13)';c.lineWidth=1.2;c.beginPath();c.moveTo(0,-len*.18);c.lineTo(0,-len*.78);c.stroke();
  c.restore();
}
const ROSE=[[350,72],[338,62],[8,78],[30,72]],COS=[[336,70],[350,55],[48,28]];
const heads={
  rose(c,o,v){const[h,s]=ROSE[v];
    for(let k=0;k<6;k++){
      const sc=1-k*.14,n=k<3?6:5,len=R*sc*(.28+.72*o),wid=len*.6;
      c.shadowColor='rgba(0,0,0,.45)';c.shadowBlur=8;
      for(let i=0;i<n;i++){
        const a=i*TAU/n+k*.8,off=len*.14;
        c.save();c.translate(Math.sin(a)*off,-Math.cos(a)*off);
        petal(c,len,wid,a,col(h,s,30-k*2),col(h,s-6,74-k*7),false);c.restore();
      }
    }
    c.shadowBlur=0;const cr=R*.2*(.5+.5*o),g=c.createRadialGradient(0,0,0,0,0,cr);
    g.addColorStop(0,col(h,s,14));g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.beginPath();c.arc(0,0,cr,0,TAU);c.fill();
  },
  sun(c,o){
    for(let r=0;r<2;r++){const n=21,len=R*(.48+.52*o)*(r?.86:1);
      if(!r){c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=6}
      for(let i=0;i<n;i++)petal(c,len,len*.24,i*TAU/n+r*3.14/n,'#b8650a',r?'#ffc928':'#ffd84a',true);
    }
    c.shadowBlur=0;const rr=R*.42*(.55+.45*o),g=c.createRadialGradient(0,0,0,0,0,rr);
    g.addColorStop(0,'#24120a');g.addColorStop(.8,'#4a2a12');g.addColorStop(1,'#6b4420');
    c.fillStyle=g;c.beginPath();c.arc(0,0,rr,0,TAU);c.fill();
    c.fillStyle='rgba(225,165,80,.55)';
    for(let i=0;i<150;i++){const a=i*2.39996,d=Math.sqrt(i/150)*rr*.94;c.beginPath();c.arc(Math.cos(a)*d,Math.sin(a)*d,1.2,0,TAU);c.fill()}
  },
  cos(c,o,v){const[h,s]=COS[v],w=v==2,n=8,len=R*(.42+.58*o);
    c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=5;
    for(let i=0;i<n;i++)petal(c,len,len*.46,i*TAU/n,col(h,s,w?80:46),col(h,s,w?98:88),false);
    c.shadowBlur=0;const cr=R*.17*(.6+.4*o),g=c.createRadialGradient(0,0,0,0,0,cr);
    g.addColorStop(0,'#f8d35a');g.addColorStop(1,'#c8861c');
    c.fillStyle=g;c.beginPath();c.arc(0,0,cr,0,TAU);c.fill();
  }
};
const SP={};
function build(){
  for(const[type,nv]of[['rose',4],['cos',3],['sun',1]]){
    SP[type]=Array.from({length:nv},(_,v)=>Array.from({length:ST},(_,i)=>{
      const k=document.createElement('canvas');k.width=k.height=S;
      const c=k.getContext('2d');c.translate(C,C);heads[type](c,i/(ST-1),v);return k;
    }));
  }
}
const glow=(()=>{const k=document.createElement('canvas');k.width=k.height=64;const x=k.getContext('2d'),
  g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,226,170,1)');g.addColorStop(.25,'rgba(255,190,120,.35)');g.addColorStop(1,'rgba(255,170,100,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);return k})();

/* ---------- scene ---------- */
function mk(layer,x,delay){
  const r=Math.random(),type=r<.22?'rose':r<.6?'cos':'sun',sc=SC[layer];
  const nv=SP[type].length;
  L[layer].push({type,v:Math.floor(Math.random()*nv),x,y:H+6,sc,s:performance.now()+delay,dur:RM?1:rnd(1600,2200),
    h:layer==2?rnd(.14,.4)*H:rnd(.26,.5)*H,bend:rnd(-34,34),ph:rnd(0,TAU),tilt:rnd(-.45,.45),
    r:(type=='sun'?rnd(24,33):type=='cos'?rnd(18,26):rnd(20,30))*sc,lf:rnd(22,34)});
}
function seed(){
  L=[[],[],[]];const cx=W/2;
  [[0,46],[1,54],[2,72]].forEach(([l,d])=>{
    const n=Math.max(5,Math.round(W/d));
    for(let i=0;i<n;i++){const x=(i+rnd(.1,.9))*W/n;mk(l,x,RM?0:200+Math.abs(x-cx)/W*2200+rnd(0,500)+l*120)}
  });
  blades=[];
  for(let l=0;l<2;l++)for(let i=0;i<W/(l?5:3);i++)blades.push({l,x:rnd(-10,W+10),h:l?rnd(26,70):rnd(40,100),ph:rnd(0,TAU),hue:rnd(105,150),li:l?rnd(20,30):rnd(13,22)});
  flies=Array.from({length:Math.round(Math.min(34,W/14))},()=>({x:rnd(0,W),y:rnd(H*.3,H*.95),s:rnd(.5,1.2),ph:rnd(0,TAU)}));
}
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);seed();
}
function drop(x,y,n){for(let i=0;i<n;i++)fall.push({x:x+rnd(-30,30),y,vy:rnd(18,40),ph:rnd(0,TAU),r:rnd(0,TAU),vr:rnd(-1.5,1.5),s:rnd(6,10),h:[345,350,10,330][i%4]})}

function grass(l,t){
  const gr=ease(clamp(t/1.2));ctx.lineCap='round';
  for(const b of blades){if(b.l!=l)continue;
    const h=b.h*gr,sw=Math.sin(t*1.1+b.ph)*8;
    ctx.strokeStyle=col(b.hue,38,b.li);ctx.lineWidth=l?2.6:2.2;
    ctx.beginPath();ctx.moveTo(b.x,H+2);ctx.quadraticCurveTo(b.x+sw*.3,H-h*.6,b.x+sw,H-h);ctx.stroke();
  }
}
function flower(f,now,t,wind){
  const p=clamp((now-f.s)/f.dur);if(p<=0)return;
  const e=ease(p),sway=(wind*13+Math.sin(t*1.1+f.ph)*3)*e*(f.h/H*2);
  const tx=f.x+f.bend*e+sway,ty=f.y-f.h*e,cx=f.x+f.bend*.15+sway*.25,cy=f.y-f.h*e*.55;
  ctx.strokeStyle=col(135,34,22);ctx.lineWidth=2.8*f.sc;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.quadraticCurveTo(cx,cy,tx,ty);ctx.stroke();
  [.28,.5,.72].forEach((u,i)=>{
    const g=clamp((e-u)/.25);if(g<=0)return;
    const px=(1-u)*(1-u)*f.x+2*u*(1-u)*cx+u*u*tx,py=(1-u)*(1-u)*f.y+2*u*(1-u)*cy+u*u*ty;
    ctx.save();ctx.translate(px,py);ctx.rotate((i%2?1:-1)*1.05+wind*.1);
    path(ctx,f.lf*g*f.sc,f.lf*g*f.sc*.3,true);ctx.fillStyle=col(138,34,26+i*5);ctx.fill();ctx.restore();
  });
  const b=ease(clamp((p-.4)/.6));
  if(p>.4){
    const st=Math.round(b*(ST-1)),k=f.r*(.4+.6*b)/R;
    ctx.save();ctx.translate(tx,ty);ctx.rotate(f.tilt+wind*.07+sway*.008);ctx.scale(k,k*.94);
    ctx.drawImage(SP[f.type][f.v][st],-C,-C);ctx.restore();
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=.16*b;
    const gs=f.r*4.2;ctx.drawImage(glow,tx-gs/2,ty-gs/2,gs,gs);ctx.restore();
  }
}
function frame(now){
  const t=(now-(frame.t0=frame.t0||now))/1000,dt=Math.min(.05,(now-last)/1000||0);last=now;
  ctx.clearRect(0,0,W,H);
  const wind=Math.sin(t*.55)*.6+Math.sin(t*1.37+1)*.25;
  grass(0,t);
  for(let l=0;l<3;l++){
    for(const f of L[l])flower(f,now+(frame.t0?0:0),t,wind);
    if(l<2){ctx.fillStyle=l?'rgba(12,8,18,.2)':'rgba(12,8,18,.38)';ctx.fillRect(0,0,W,H)}
  }
  grass(1,t);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const o of flies){
    const x=o.x+Math.sin(t*.25*o.s+o.ph)*44,y=o.y+Math.cos(t*.2*o.s+o.ph)*30-((t*6*o.s)%40);
    ctx.globalAlpha=clamp(t/1.5)*(.25+.75*Math.abs(Math.sin(t*o.s*1.3+o.ph)));
    ctx.drawImage(glow,x-11,y-11,22,22);
  }
  ctx.restore();
  if(t>8&&now-lastDrop>1100){lastDrop=now;drop(rnd(0,W),-10,1)}
  for(let i=fall.length-1;i>=0;i--){
    const f=fall[i];f.y+=f.vy*dt;f.x+=(Math.sin(t*1.2+f.ph)*18+wind*20)*dt;f.r+=f.vr*dt;
    if(f.y>H+20){fall.splice(i,1);continue}
    ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.r);ctx.scale(1,.6+.4*Math.sin(t*2+f.ph));
    path(ctx,f.s,f.s*.55,false);ctx.fillStyle=`hsla(${f.h},70%,76%,.85)`;ctx.fill();ctx.restore();
  }
  requestAnimationFrame(frame);
}
addEventListener('resize',resize);
cv.addEventListener('pointerdown',e=>{
  for(let i=0;i<2;i++)if(L[2].length<120)mk(2,e.clientX+rnd(-18,18),i*160);
  drop(e.clientX,e.clientY,8);
});

/* ---------- page 2: loading, then the message ---------- */
const pg2=document.getElementById('pg2'),note=document.getElementById('note'),ld=document.getElementById('ld'),bar=document.getElementById('bar'),pct=document.getElementById('pct');
const PARAS=['Hey Ivy. I’m so sorry I can’t be there for your birthday.','So I made you this little garden instead. It’s your gift, since I couldn’t hand you one in person.','Honestly, I just really like hanging out with you. You’re funny, we laugh at the same dumb jokes, and I always wish the time went slower.','Hope you have a great day and eat way too much cake.'];
const STOPS=[[0,0],[.4,34],[.7,34],[1.1,71],[1.5,71],[1.9,99],[3,99],[3.2,100]];
const pctAt=t=>{for(let i=1;i<STOPS.length;i++){const[a,x]=STOPS[i-1],[b,y]=STOPS[i];if(t<=b)return x+(y-x)*clamp((t-a)/(b-a))}return 100};
function showNote(){
  ld.style.opacity=0;
  setTimeout(()=>{
    ld.style.display='none';let d=.2;
    PARAS.forEach(t=>{const p=document.createElement('p');p.textContent=t;p.style.animationDelay=d+'s';note.appendChild(p);d+=.5+t.length*.01});
    const f=document.createElement('p');f.className='fin';f.textContent='Happy birthday, Ivy.';f.style.animationDelay=d+'s';note.appendChild(f);
    const q=document.createElement('button');q.className='sur';q.textContent='click here for a surprise';q.style.animationDelay=(d+1.2)+'s';q.onclick=openSurprise;note.appendChild(q);
    for(let k=0;k<40;k++)setTimeout(()=>drop(rnd(0,W),-10,1),(d+.3)*1000+k*140);
  },300);
}
document.getElementById('back').onclick=()=>{document.body.classList.remove('p2');pg2.classList.remove('on');pg2.setAttribute('aria-hidden','true')};
const pg3=document.getElementById('pg3'),vid=document.getElementById('vid');
function openSurprise(){pg3.classList.add('on');pg3.removeAttribute('aria-hidden');vid.currentTime=0;vid.play().catch(()=>{})}
document.getElementById('back3').onclick=()=>{pg3.classList.remove('on');pg3.setAttribute('aria-hidden','true');vid.pause()};
let opened=false;
document.getElementById('go').onclick=()=>{
  document.body.classList.add('p2');pg2.classList.add('on');pg2.removeAttribute('aria-hidden');
  if(opened)return;opened=true;const t0=performance.now()+300;
  (function step(now){const t=(now-t0)/1000;if(t<0){requestAnimationFrame(step);return}
    const v=pctAt(t);bar.firstElementChild.style.width=v+'%';
    pct.textContent=(v>=99&&t<3.1)?(t>2.6?'99% \u00b7 hmm, this is taking a while\u2026':'99% \u00b7 almost there\u2026'):'loading\u2026 '+Math.round(v)+'%';
    if(t<3.3)requestAnimationFrame(step);else showNote()})(performance.now());
};
